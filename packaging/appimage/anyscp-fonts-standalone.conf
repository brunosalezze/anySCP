<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Used by the anySCP AppImage on systems without any fontconfig setup
     (minimal containers): bundled fonts and alias rules. -->
<fontconfig>
  <dir prefix="relative">../../fonts</dir>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <include ignore_missing="yes">conf.d</include>
  <alias binding="same"><family>sans-serif</family><prefer><family>Ubuntu</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Sans</family><prefer><family>Ubuntu</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>system-ui</family><prefer><family>Ubuntu</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Adwaita Sans</family><prefer><family>Ubuntu</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Cantarell</family><prefer><family>Ubuntu</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>Source Code Pro</family><family>Ubuntu Mono</family></prefer></alias>
  <alias binding="same"><family>Monospace</family><prefer><family>Source Code Pro</family><family>Ubuntu Mono</family></prefer></alias>
  <alias binding="same"><family>Adwaita Mono</family><prefer><family>Source Code Pro</family><family>Ubuntu Mono</family></prefer></alias>
  <alias binding="same"><family>Serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
