# SPDX-License-Identifier: GPL-3.0-or-later
# Builds the portable packages (AppImages for x86-64 and arm64, single-file
# executables for Windows x64 and arm64) from this repository, after the
# backend tests.  The Windows executables built here are the ones that get
# code-signed (see CODE_SIGNING_POLICY.md).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      ANYSCP_CI: "1"
      # What packaging/setup-build-deps.sh makes (all but conda's package cache).
      DEPS: |
        build/tools
        build/appimage/env
        build/appimage/env-aarch64
        build/appimage/buildenv-aarch64
        build/appimage/extras-aarch64
        build/appimage/extras-src
        build/windows/env
        build/windows/env-arm64
        build/msys2
    steps:
      - uses: actions/checkout@v7

      - name: Make room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # Setting these up takes almost half an hour (the arm64 libraries are
      # compiled under emulation): reuse them until the setup changes.  They
      # are saved as soon as they are ready, whatever happens afterwards.
      - name: Restore the build dependencies
        id: deps
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.DEPS }}
          key: build-deps-v2-${{ hashFiles('packaging/setup-build-deps.sh', 'packaging/appimage/arm64-extras.env', 'packaging/appimage/build-arm64-extras.sh', 'packaging/appimage/conda_pins.py', 'packaging/windows/msys2-packages.txt', 'packaging/windows/msys2_fetch.py') }}

      - name: arm64 emulation (to build the arm64 libraries in a container)
        if: steps.deps.outputs.cache-hit != 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up the build dependencies
        run: ./packaging/setup-build-deps.sh

      - name: Save the build dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.DEPS }}
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Backend tests
        run: |
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-glib-2.0 python3-venv openssh-server
          python3 -m venv --system-site-packages .venv
          # (Ubuntu 24.04's own paramiko and cryptography are older than anySCP needs)
          .venv/bin/pip install -q pytest pyftpdlib pyopenssl wsgidav cheroot "paramiko>=3.4,<4" "cryptography>=42"
          .venv/bin/python -m pytest -q

      - name: AppImages (x86-64, arm64)
        run: |
          packaging/appimage/build.sh
          packaging/appimage/build.sh aarch64

      - name: Windows executables (x64, arm64)
        run: |
          packaging/windows/build.sh
          packaging/windows/build.sh arm64

      - name: Checksums
        run: |
          cd dist
          sha256sum * | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: anySCP-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
