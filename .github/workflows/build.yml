# SPDX-License-Identifier: GPL-3.0-or-later
# Builds the portable packages (AppImages for x86-64 and arm64, single-file
# executables for Windows x64 and arm64) from this repository, after the
# backend tests.  The Windows executables built here are the ones that get
# code-signed (see CODE_SIGNING_POLICY.md).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      ANYSCP_CI: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Make room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: arm64 emulation (for the arm64 libraries built in a container)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # The runtimes, tools and the arm64 libraries take a while to download
      # and build: reuse them until the setup changes.
      - name: Cache the build dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/tools
            build/mamba/pkgs
            build/appimage/env
            build/appimage/env-aarch64
            build/appimage/buildenv-aarch64
            build/appimage/extras-aarch64
            build/appimage/extras-src
            build/windows/env
            build/windows/env-arm64
            build/msys2
          key: build-deps-v1-${{ hashFiles('packaging/setup-build-deps.sh', 'packaging/appimage/arm64-extras.env', 'packaging/appimage/build-arm64-extras.sh', 'packaging/appimage/conda_pins.py', 'packaging/windows/msys2-packages.txt', 'packaging/windows/msys2_fetch.py') }}

      - name: Set up the build dependencies
        run: ./packaging/setup-build-deps.sh

      - name: Backend tests
        run: |
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-glib-2.0 python3-paramiko \
              python3-cryptography python3-venv openssh-server
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -q pytest pyftpdlib pyopenssl wsgidav cheroot
          .venv/bin/python -m pytest -q

      - name: AppImages (x86-64, arm64)
        run: |
          packaging/appimage/build.sh
          packaging/appimage/build.sh aarch64

      - name: Windows executables (x64, arm64)
        run: |
          packaging/windows/build.sh
          packaging/windows/build.sh arm64

      - name: Checksums
        run: |
          cd dist
          sha256sum * | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: anySCP-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
