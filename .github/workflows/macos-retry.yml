# SPDX-License-Identifier: GPL-3.0-or-later
# Re-runs the macOS build when GitHub could not give it a runner.
#
# GitHub's Apple Silicon runners are now and then all taken: the macOS job
# then waits about fifteen minutes, is cancelled with "The job was not
# acquired by Runner of type hosted even after multiple attempts", and the
# run goes red although nothing was built (see macos.yml).  This workflow
# re-runs such a run, spaced out and with a limit, so that the build is made
# once a runner is free again and the run turns green on its own.
#
# It re-runs nothing else.  When a job really ran and failed, that failure is
# left standing: a run is only re-run when every job that did not succeed is
# one that no runner ever took.  A run is re-run while it has made fewer than
# four attempts, one run at a time (the macOS runs share a concurrency group,
# and a re-run would cancel a newer one), and for at most seventy minutes.
name: macOS retry

on:
  workflow_run:
    workflows: [macOS]
    types: [completed]
  workflow_dispatch:            # by hand: look over the recent macOS runs again

permissions:
  contents: read

concurrency:                    # one watcher at a time
  group: macos-retry
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      actions: write            # to re-run the jobs
      checks: read              # to read the "not acquired by Runner" annotations
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TRIGGER_RUN: ${{ github.event.workflow_run.id }}
    steps:
      - name: Re-run the macOS runs that never got a runner
        run: |
          python3 - <<'PY'
          """Look over the recent macOS runs and re-run those that failed only
          because no runner took their job, newest first, one at a time."""
          import json, os, time, urllib.error, urllib.request

          REPO = os.environ["REPO"]
          API = "https://api.github.com"
          HEADERS = {"Accept": "application/vnd.github+json",
                     "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                     "X-GitHub-Api-Version": "2022-11-28"}
          MAX_ATTEMPTS = 4        # a run is re-run while its attempt count is below this
          BUDGET = 70 * 60        # seconds spent on re-runs and waiting, in all
          BREATHER = 10 * 60      # seconds to wait before re-running a run that starved again
          LOOK = 30               # seconds between two looks at a re-run

          def call(path, method="GET"):
              request = urllib.request.Request(API + path, method=method, headers=HEADERS)
              try:
                  with urllib.request.urlopen(request) as reply:
                      body = reply.read()
              except urllib.error.HTTPError as err:
                  return None, f"HTTP {err.code}: {err.read().decode(errors='replace')[:200]}"
              return (json.loads(body) if body else {}), None

          def note(line, summary=False):
              print(line, flush=True)
              if summary:
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
                      out.write(line + "\n")

          def never_acquired(job):
              """A job no runner ever took: no step ran, no runner is named, and
              GitHub annotated 'The job was not acquired by Runner ...'."""
              if job["steps"] or job["runner_name"]:
                  return False
              annotations, err = call(f"/repos/{REPO}/check-runs/{job['id']}/annotations?per_page=100")
              return bool(annotations) and any("was not acquired by Runner" in a["message"]
                                               for a in annotations)

          def starved(run_id):
              """True when every job that did not succeed is one that no runner took."""
              jobs, err = call(f"/repos/{REPO}/actions/runs/{run_id}/jobs?per_page=100")
              if not jobs:
                  note(f"    cannot read the jobs of run {run_id}: {err}")
                  return False
              unfinished = [j for j in jobs["jobs"] if j["conclusion"] != "success"]
              return bool(unfinished) and all(never_acquired(j) for j in unfinished)

          def reason_to_skip(run):
              """None when the run may be re-run; otherwise why not.  The recent
              runs are read again every time: the re-run must not stand in the
              way of a newer one (they share the workflow's concurrency group)."""
              if run["conclusion"] not in ("failure", "cancelled"):
                  return f"it ended as {run['conclusion']}"
              if run["run_attempt"] >= MAX_ATTEMPTS:
                  return f"it has already made {run['run_attempt']} attempts"
              if not starved(run["id"]):
                  return "something really ran and failed"
              listed, err = call(f"/repos/{REPO}/actions/workflows/macos.yml/runs?per_page=20")
              for other in (listed or {}).get("workflow_runs", []):
                  if other["id"] == run["id"]:
                      continue
                  if other["head_sha"] == run["head_sha"] and other["created_at"] >= run["created_at"]:
                      return "a newer run of the same commit has taken over"
                  if other["head_branch"] == run["head_branch"] \
                          and other["status"] in ("queued", "in_progress"):
                      return "another run on the same branch is on its way"
              return None

          def wait_for(run_id, deadline):
              """The outcome of the run's current attempt, in words."""
              while time.monotonic() < deadline:
                  run, err = call(f"/repos/{REPO}/actions/runs/{run_id}")
                  if not run:
                      return f"cannot read the run: {err}"
                  if run["status"] == "completed":
                      if run["conclusion"] == "success":
                          return "success"
                      return "no runner again" if starved(run_id) else f"it ended as {run['conclusion']}"
                  time.sleep(LOOK)
              return "the time ran out while it was still going"

          def rerun(run_id):
              """Re-run the jobs of the run, trying a little while: the moment a
              run ends, it is not always re-runnable yet."""
              err = "nothing tried"
              for _ in range(3):
                  err = call(f"/repos/{REPO}/actions/runs/{run_id}/rerun-failed-jobs", "POST")[1]
                  if err and "no failed" in err.lower():
                      # (nothing was counted as failed: re-run the whole run)
                      err = call(f"/repos/{REPO}/actions/runs/{run_id}/rerun", "POST")[1]
                  if err is None:
                      return None
                  time.sleep(10)
              return err

          def main():
              deadline = time.monotonic() + BUDGET
              workflow, err = call(f"/repos/{REPO}/actions/workflows/macos.yml")
              if not workflow:
                  note(f"cannot find the macOS workflow: {err}", summary=True)
                  return 1
              listed, err = call(f"/repos/{REPO}/actions/workflows/{workflow['id']}/runs?per_page=20")
              if not listed:
                  note(f"cannot list the macOS runs: {err}", summary=True)
                  return 1
              runs = listed["workflow_runs"]

              # Newest first: the run that set this off, then the recent ones
              # (the macOS runs of the past weeks may still be waiting).
              candidates = sorted({str(r["id"]) for r in runs} | {os.environ.get("TRIGGER_RUN") or ""},
                                  key=lambda i: next((r["created_at"] for r in runs if str(r["id"]) == i), ""),
                                  reverse=True)

              for run_id in candidates:
                  if not run_id or time.monotonic() >= deadline:
                      break
                  run = next((r for r in runs if str(r["id"]) == run_id), None)
                  if run is None:
                      run, err = call(f"/repos/{REPO}/actions/runs/{run_id}")
                      if not run:
                          continue
                  while time.monotonic() < deadline:
                      why = reason_to_skip(run)
                      if why:
                          note(f"run {run_id}: not re-run: {why}", summary=True)
                          break
                      note(f"run {run_id}: re-running the jobs that never got a runner", summary=True)
                      err = rerun(run["id"])
                      if err:
                          note(f"run {run_id}: could not be re-run: {err}", summary=True)
                          break
                      outcome = wait_for(run["id"], deadline)
                      note(f"run {run_id}: {outcome}", summary=True)
                      if outcome != "no runner again":
                          break
                      run, err = call(f"/repos/{REPO}/actions/runs/{run['id']}")
                      if not run or time.monotonic() + BREATHER >= deadline:
                          break
                      note(f"run {run_id}: waiting {BREATHER // 60} minutes before trying once more")
                      time.sleep(BREATHER)
              note("done", summary=True)
              return 0

          raise SystemExit(main())
          PY
