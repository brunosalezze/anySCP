# SPDX-License-Identifier: GPL-3.0-or-later
# The macOS app (Apple Silicon only), experimental: built and self-tested on
# GitHub's Macs, not yet tried by a person.  A workflow of its own, as GitHub's
# Apple Silicon runners are sometimes not available for a long while, which
# must not turn the main build red: it runs when the macOS packaging changes,
# every Monday, for version tags and by hand.  A run that goes red only because
# no runner was free is re-run by macos-retry.yml.
name: macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "packaging/macos/**"
      - ".github/workflows/macos.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    continue-on-error: true
    env:
      ANYSCP_CI: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Reuse the conda packages
        uses: actions/cache@v6
        with:
          path: build/mamba/pkgs
          key: macos-pkgs-v1-${{ hashFiles('packaging/macos/build.sh') }}

      - name: anySCP.app and its disk image
        run: packaging/macos/build.sh

      # The app as people get it: from the disk image, read-only
      - name: Self-test of the app in the disk image, with a picture of the window
        timeout-minutes: 5
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist/anySCP-*-macos-arm64.dmg
          codesign --verify --strict --verbose=1 "$RUNNER_TEMP/dmg/anySCP.app"
          ANYSCP_SELFTEST_SCREENSHOT="$PWD/dist/macos-window.png" \
              "$RUNNER_TEMP/dmg/anySCP.app/Contents/MacOS/anySCP" --self-test
          hdiutil detach "$RUNNER_TEMP/dmg"

      - name: Backend tests
        run: |
          build/macos/env/bin/python -m pip install -q pytest pyftpdlib pyopenssl wsgidav cheroot
          build/macos/env/bin/python -m pytest -q

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: anySCP-macos-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/macos-window.png
          if-no-files-found: warn
          retention-days: 30
